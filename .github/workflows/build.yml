name: Build App X-Ray

# Builds the Android app in GitHub's cloud on every push, then publishes the
# APK under Releases (tag: latest) so it can be downloaded straight to a phone.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app-xray.apk
          ls -l app-xray.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-xray
          path: app-xray.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app-xray.apk \
            --title "App X-Ray (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap app-xray.apk to download and install it." \
            --target "${{ github.sha }}"
